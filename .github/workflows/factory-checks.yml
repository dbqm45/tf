# Factory checks without a model (no secrets, no cost): references between layers, repository tests, and
# build and tests in an assembled project — the core alone, each overlay separately, and all together (tools/workspace.py).
# CI does not run the (paid) model evaluation — a human does it: python3 .tf/factory/skill_gate.py <skill> --model haiku,sonnet
#
# Speed (docs/RELEASING.md, "CI"): the slow `all` set runs in duration-balanced shards (`--shard i/n`, the times in
# tools/test-durations.json). On a pull request the workspace jobs run only the tests related to the changed files
# (`--changed-from <base>`; the full suite when the change touches shared infrastructure or the selection is unsure).
# A push to main always runs the full suite, and the release workflow starts only after this workflow succeeded there.
name: factory-checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The core names no overlay items, overlays only those they depend on
        run: python3 tools/workspace.py refs
      - run: for t in tests/test_*.py; do python3 "$t" || exit 1; done
      - name: Catalog coverage map (informational, does not block)
        run: python3 tools/coverage_map.py --summary
      - name: pdi contract copies match the release tag (tools/pdi-contract.json)
        run: python3 tools/sync_contract.py check

  addons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dodatki (addons/*) — niezależne od rdzenia i od siebie
        run: for t in addons/*/tests/test_*.py; do python3 "$t" || exit 1; done

  container:
    # The session image of the isolation level `container` (core/factory/container/): build, firewall, read-only
    # filesystem, the session as `node` without capabilities (tests/test_container_image.py)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 tests/test_container_image.py
        env:
          TF_CONTAINER_TEST: "1"

  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `tools/workspace.py new-pack` adds a new overlay or mode to this list, before `all`.
        packs: [none, pack-it, pack-ux, pack-docs, pack-editorial-pl, mode-team, mode-pdi, all]
        # `all` is the long pole (13–15 min in one job), so it runs as duration-balanced shards; together they run
        # exactly the tests of one full run (tests/test_workspace_ci.py). The cheap checks run in shard 1.
        exclude:
          - packs: all
        include:
          - {packs: all, shard: 1/3}
          - {packs: all, shard: 2/3}
          - {packs: all, shard: 3/3}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # a pull request selects its tests from `git diff <base>...HEAD`, so it needs the history to the base
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Ubuntu 23.10+ blocks unprivileged user namespaces, and without them Chromium has no sandbox
      # (test_fetch_page renders a page). Allowed only for this one browser, via an AppArmor profile — "Option 2"
      # from chromium/src docs/security/apparmor-userns-restrictions.md; the block for the rest of the system and the sandbox remain.
      - name: Profil AppArmor dla Chromium (test_fetch_page)
        run: |
          [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ] || exit 0
          browser=$(python3 -c 'import importlib.util as u; s = u.spec_from_file_location("fp", "core/skills/core-source-research/scripts/fetch_page.py"); m = u.module_from_spec(s); s.loader.exec_module(m); print(m.find_browser() or "")')
          [ -n "$browser" ] || exit 0
          browser=$(readlink -f "$browser")
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\n\nprofile tf-chromium %s flags=(unconfined) {\n  userns,\n}\n' "$browser" \
            | sudo tee /etc/apparmor.d/tf-chromium
          sudo apparmor_parser -r /etc/apparmor.d/tf-chromium
      # The first Chromium start on the runner takes 15–30 s (loading the large browser file from a cold disk; measured
      # in PR #12: first render 16–27 s, later ones about 0.7 s, regardless of flags). Under the load of the whole test suite
      # that first start in test_fetch_page exceeded 60 s — hence a separate warm-up, with its own time limit.
      - name: Chromium warm-up (first start)
        run: |
          python3 - <<'PY'
          import importlib.util as u, time
          s = u.spec_from_file_location("fp", "core/skills/core-source-research/scripts/fetch_page.py")
          m = u.module_from_spec(s); s.loader.exec_module(m)
          b = m.find_browser()
          if b:
              t = time.time(); m.render("about:blank", b, timeout=180)
              print(f"Chromium {b}: first start {time.time() - t:.1f} s")
          PY
      - name: Build and tests in a project with overlays ${{ matrix.packs }} ${{ matrix.shard }}
        # pull_request: only the tests related to the change (or the full suite, with the reason in the log);
        # push to main: always the full suite
        run: >-
          python3 tools/workspace.py check --packs "${{ matrix.packs }}" --shard "${{ matrix.shard || '1/1' }}" --timings
          ${BASE_SHA:+--changed-from "$BASE_SHA"}
        env:
          CTF_REQUIRE_BROWSER: "1"  # test_fetch_page fails without Chromium instead of skipping the render
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
