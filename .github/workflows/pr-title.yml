name: pr-title

# PRs are squash-merged, so the PR title becomes the commit on main and decides the next version
# (docs/RELEASING.md). It also runs after a title edit, without re-running the whole CI.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The title goes through an environment variable, never into the script body.
      - run: python3 scripts/check_commit_message.py "$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}
