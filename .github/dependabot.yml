version: 2
# PR titles use the Conventional Commits format (docs/RELEASING.md): ci(deps): … — the ci type does not bump the factory version.
# The factory has no dependencies of its own (only the Python standard library); we update the actions in the workflows.
# examples/sklep-wycena is an example without a lockfile and without CI, so it is not covered here.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      # One PR per week with all the actions.
      actions:
        patterns: ["*"]
