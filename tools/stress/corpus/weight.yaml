# Task weight corpus (core/factory/task_weight.py: propose). `ok` is the set of weights a careful lead would accept;
# a result below every accepted weight is an under-weight (a sensitive change without the full ceremony) and fails hard.
# Edge axes: language (pl/en/mixed), negation, synonyms the rules may not know, injection in the text, sizes (empty,
# one word, 20k characters), formatting (markdown, emoji, code blocks), false friends (a variable named password).
