# TDD gate sequences (core/hooks/tdd_guard.py): each case is one fresh session; its steps are hook calls in order.
# A step with `expect` checks the decision (allow | deny) or, with `note`, that the hook's additional context
# contains the text. Bash steps carry the result the hook sees (`exit`, `out`). Edge axes: test runner spellings
# (npm test, node --test, verify.sh, test_lock wrapper), a green-first test, a red run with no assertions,
# characterization, weakening, many edits after one red test, subagent contexts.
cases:
  - id: T001
    name: classic red → code
    steps:
      - {event: PostToolUse, tool: Write, input: {file_path: "{proj}/test/a.test.js"}}
      - {event: PostToolUse, tool: Bash, input: {command: "npm test"}, exit: 1, out: "not ok 1 - a\n# fail 1"}
      - {event: PreToolUse, tool: Write, input: {file_path: "{proj}/src/a.js", content: "x"}, expect: allow}
  - id: T002
    name: code without any test
    steps:
      - {event: PreToolUse, tool: Write, input: {file_path: "{proj}/src/a.js", content: "x"}, expect: deny}
  - id: T003
    name: test passed right away (not proof)
    steps:
      - {event: PostToolUse, tool: Write, input: {file_path: "{proj}/test/a.test.js"}}
      - {event: PostToolUse, tool: Bash, input: {command: "npm test"}, exit: 0, out: "ok 1 - a\n# pass 1"}
      - {event: PreToolUse, tool: Edit, input: {file_path: "{proj}/src/a.js", old_string: "a", new_string: "b"}, expect: deny}
  - id: T004
    name: red via node --test (native runner)
    steps:
      - {event: PostToolUse, tool: Write, input: {file_path: "{proj}/test/a.test.js"}}
      - {event: PostToolUse, tool: Bash, input: {command: "node --test test/a.test.js"}, exit: 1, out: "not ok 1 - a\n# fail 1"}
      - {event: PreToolUse, tool: Write, input: {file_path: "{proj}/src/a.js", content: "x"}, expect: allow}
  - id: T005
    name: red via ./verify.sh (generated by tf onboard)
    steps:
      - {event: PostToolUse, tool: Write, input: {file_path: "{proj}/test/a.test.js"}}
      - {event: PostToolUse, tool: Bash, input: {command: "./verify.sh"}, exit: 1, out: "== tests\nnot ok 1 - a\n# fail 1"}
      - {event: PreToolUse, tool: Write, input: {file_path: "{proj}/src/a.js", content: "x"}, expect: allow}
  - id: T006
    name: red via test_lock wrapper
    steps:
      - {event: PostToolUse, tool: Write, input: {file_path: "{proj}/test/a.test.js"}}
      - {event: PostToolUse, tool: Bash, input: {command: "python3 .claude/hooks/test_lock.py -- npm test"}, exit: 1, out: "not ok 1\n# fail 1"}
      - {event: PreToolUse, tool: Write, input: {file_path: "{proj}/src/a.js", content: "x"}, expect: allow}
  - id: T007
    name: red via pytest (python stack)
    steps:
      - {event: PostToolUse, tool: Write, input: {file_path: "{proj}/tests/test_a.py"}}
      - {event: PostToolUse, tool: Bash, input: {command: "python3 -m pytest tests/test_a.py"}, exit: 1, out: "FAILED tests/test_a.py::test_a - AssertionError"}
      - {event: PreToolUse, tool: Write, input: {file_path: "{proj}/app/a.py", content: "x"}, expect: allow}
  - id: T008
    name: red with a syntax error only (no assertion ran) — a warning, by design no block
    steps:
      - {event: PostToolUse, tool: Write, input: {file_path: "{proj}/tests/test_a.py"}}
      - {event: PostToolUse, tool: Bash, input: {command: "python3 -m pytest tests/test_a.py"}, exit: 2, out: "E   SyntaxError: invalid syntax\nERROR collecting tests/test_a.py", note: "no assertions"}
      - {event: PreToolUse, tool: Write, input: {file_path: "{proj}/app/a.py", content: "x"}, expect: allow}
  - id: T009
    name: command not found is not red
    steps:
      - {event: PostToolUse, tool: Write, input: {file_path: "{proj}/test/a.test.js"}}
      - {event: PostToolUse, tool: Bash, input: {command: "npm test"}, exit: 127, out: "bash: npm: command not found"}
      - {event: PreToolUse, tool: Write, input: {file_path: "{proj}/src/a.js", content: "x"}, expect: deny}
  - id: T010
    name: thirteenth production edit after one red test
    steps:
      - {event: PostToolUse, tool: Write, input: {file_path: "{proj}/test/a.test.js"}}
      - {event: PostToolUse, tool: Bash, input: {command: "npm test"}, exit: 1, out: "# fail 1"}
      - {event: PreToolUse, tool: Edit, input: {file_path: "{proj}/src/a.js", old_string: "a", new_string: "b"}, expect: allow}
      - {repeat: 12, event: PostToolUse, tool: Edit, input: {file_path: "{proj}/src/a.js"}}
      - {event: PreToolUse, tool: Edit, input: {file_path: "{proj}/src/a.js", old_string: "a", new_string: "b"}, expect: deny}
  - id: T011
    name: config and styles are exempt
    steps:
      - {event: PreToolUse, tool: Write, input: {file_path: "{proj}/package.json", content: "{}"}, expect: allow}
      - {event: PreToolUse, tool: Write, input: {file_path: "{proj}/public/style.css", content: "a{}"}, expect: allow}
      - {event: PreToolUse, tool: Write, input: {file_path: "{proj}/README.md", content: "x"}, expect: allow}
  - id: T012
    name: HTML template exempt, JS in public is not
    steps:
      - {event: PreToolUse, tool: Edit, input: {file_path: "{proj}/public/index.html", old_string: "a", new_string: "b"}, expect: allow}
      - {event: PreToolUse, tool: Edit, input: {file_path: "{proj}/public/app.js", old_string: "a", new_string: "b"}, expect: deny}
  - id: T013
    name: weakening a test warns
    files: {"test/w.test.js": "import {test} from 'node:test';\nimport assert from 'node:assert';\ntest('a', () => { assert.equal(1,1); assert.equal(2,2); });\n"}
    steps:
      - {event: PreToolUse, tool: Edit, input: {file_path: "{proj}/test/w.test.js", old_string: "assert.equal(1,1); assert.equal(2,2);", new_string: "assert.ok(true);"}, note: "weak"}
  - id: T014
    name: a skip added to a test warns
    files: {"test/w.test.js": "import {test} from 'node:test';\ntest('a', () => {});\n"}
    steps:
      - {event: PreToolUse, tool: Edit, input: {file_path: "{proj}/test/w.test.js", old_string: "test('a'", new_string: "test.skip('a'"}, note: "skip"}
  - id: T015
    name: subagent context is separate
    steps:
      - {event: PostToolUse, tool: Write, input: {file_path: "{proj}/test/a.test.js"}}
      - {event: PostToolUse, tool: Bash, input: {command: "npm test"}, exit: 1, out: "# fail 1"}
      - {event: PreToolUse, tool: Write, agent: sub-1, input: {file_path: "{proj}/src/a.js", content: "x"}, expect: deny}
  - id: T016
    name: vitest via npx
    steps:
      - {event: PostToolUse, tool: Write, input: {file_path: "{proj}/src/a.test.ts"}}
      - {event: PostToolUse, tool: Bash, input: {command: "npx vitest run src/a.test.ts"}, exit: 1, out: " FAIL  src/a.test.ts > a\nTests  1 failed"}
      - {event: PreToolUse, tool: Write, input: {file_path: "{proj}/src/a.ts", content: "x"}, expect: allow}
  - id: T017
    name: go test
    steps:
      - {event: PostToolUse, tool: Write, input: {file_path: "{proj}/pkg/a_test.go"}}
      - {event: PostToolUse, tool: Bash, input: {command: "go test ./pkg/..."}, exit: 1, out: "--- FAIL: TestA\nFAIL"}
      - {event: PreToolUse, tool: Write, input: {file_path: "{proj}/pkg/a.go", content: "x"}, expect: allow}
  - id: T018
    name: make test (common wrapper)
    steps:
      - {event: PostToolUse, tool: Write, input: {file_path: "{proj}/tests/test_a.py"}}
      - {event: PostToolUse, tool: Bash, input: {command: "make test"}, exit: 2, out: "FAILED tests/test_a.py::test_a - AssertionError\nmake: *** [test] Error 1"}
      - {event: PreToolUse, tool: Write, input: {file_path: "{proj}/app/a.py", content: "x"}, expect: allow}
