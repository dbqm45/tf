# Polish text editing overlay: correctness (spelling, punctuation per RJP PAN) and style, the polish-editor agent,
# the Stefan persona. A regular overlay (`tf add pack-editorial-pl`): useful to anyone who writes in Polish; its rules
# apply only to Polish text, so they do not get in the way of a conversation in another language.
id: pack-editorial-pl
version: 1.0.1
title: Polish editorial
description: Polish language editing — correctness and style checks, the polish-editor agent and the Stefan persona. For anyone who writes in Polish.
content_language: en
requires:
  core: ">=3.0.0 <21.0.0"
optional_packs: [pack-docs]

facets:
  - {prefix: txt-, order: 160, name: language and editing, question: "how to write correctly and clearly in Polish — spelling, punctuation, style, editing"}

# Contribution to personas, roles and routing (the rules apply only to Polish text).
contributes:
  personas:
    traits: [polish-language]
  roles:
    tech-writer:                # a role from pack-docs
      skills: [txt-polish-correctness]
routing: |
  | a Polish text for people, ready to hand over (an artifact before `proposed`, README, a description) | polish-editor | std |

shared_agents:
  # The Polish language editor for all personas: proofreading and editing of Polish texts before they go to a human.
  polish-editor:
    tier: std
    description: Proofreading and editing of Polish text (documentation, docs/project artifacts, README, descriptions) — spelling and punctuation per RJP PAN, style, terminology; pointwise corrections, no changes of substance. Give the files and the mode (proofreading = a report, editing = corrections).
    tools: [Read, Grep, Glob, Edit, Bash, Skill]
    skills: [txt-polish-correctness]
    prompt: |
      You are an editor of Polish. 1) Run `python3 .claude/skills/txt-polish-correctness/scripts/polish_lint.py <pliki>`.
      2) Read the text and correct errors against the norm (the txt-polish-correctness skill); in editing mode also the style per txt-polish-style
      (standard mode). Pointwise changes (Edit); do not touch code, commands, numbers, source quotations, terms from the project
      glossary or artifact statuses. Proofreading mode: do not change files, return a report per references/analysis-report.md.
      3) Return a note: files, the number of corrections by category, the 3 most frequent patterns, questions to the author.
