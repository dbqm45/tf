# Documentation overlay: technical writing (README, API, ADR, CHANGELOG, runbooks, manuals)
# and the Technical Writer role. Attaches to all personas.
id: pack-docs
version: 1.0.2
title: Documentation
description: Technical writing — README, API docs, ADRs, changelogs, runbooks and manuals; adds the docs skill to every persona and the tech-writer role.
content_language: en
default: true          # selected by default in the installer
requires:
  core: ">=3.0.0 <23.0.0"
# The docs skill gives examples from the skills of these overlays; without them the references are plain text.
optional_packs: [pack-it, pack-ux, pack-editorial-pl]

facets:
  - {prefix: docs-, order: 175, name: documentation, question: "how we write and maintain technical documentation — types, structure, style, review"}

routing: |
  | writing down an artifact or a document whose content is already settled | {persona}-tech-writer (if present) | fast |

contributes:
  personas:
    core_skills: [docs-tech-writing]   # each persona's "Skille wspólne" (shared skills)
