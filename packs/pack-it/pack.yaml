# IT overlay: software engineering — architecture, DDD, backend, frontend, operations, security, AI, data,
# testing and process. The personas and roles of this overlay build software in any domain.
id: pack-it
version: 1.4.0
title: IT
description: Software engineering team — architecture, DDD, backend, frontend, DevOps/SRE, security, AI/ML, data, QA and process.
content_language: en
requires:
  core: ">=3.0.0 <25.0.0"
# References to elements of these overlays are skipped when the overlay is absent (no error).
optional_packs: [pack-docs, pack-ux, pack-editorial-pl]

facets:
  - {prefix: ddd-,  order: 10,  name: method and domain, question: "WHAT we model and with which concepts — independent of technology"}
  - {prefix: arch-, order: 20,  name: architecture,    question: "which drivers shape the system and which stack/style meets them best"}
  - {prefix: fe-,   order: 40,  name: UI layer,        question: "which rules apply in the user interface — in every framework"}
  - {prefix: be-,   order: 50,  name: server layer,    question: "which rules apply on the server side — in every language"}
  - {prefix: ai-,   order: 60,  name: AI systems,      question: "how we build, evaluate and oversee AI systems — data, models, evaluations, deployment, risk"}
  - {prefix: ops-,  order: 70,  name: operations,      question: "how we build, deploy and observe"}
  - {prefix: sec-,  order: 80,  name: security,        question: "how we protect the system and the organization — security engineering and architecture, risk, compliance, governance"}
  - {prefix: eng-,  order: 120, name: engineering principles, question: "how to write simply and well (KISS, YAGNI, SOLID, tests, CD) — constraints and settling disputes"}
  - {prefix: qa-,   order: 130, name: quality and testing, question: "how to design, run and maintain tests so that they check the requirements — independent of the tool"}
  - {prefix: data-, order: 140, name: data analysis,   question: "how to answer questions with data — acquisition, cleaning, statistics, visualization, report"}
  - {prefix: pm-,   order: 165, name: product and market, question: "for whom and for how much — positioning, market, SaaS business metrics, product lifecycle, stakeholders"}
  - {prefix: proc-, order: 170, name: process,         question: "how we plan, collaborate and deliver (Agile, Lean, SAFe)"}

skill_requires:
  fw-angular: [lang-typescript, fe-web-platform]
  fw-react: [fe-web-platform]
  fw-nextjs: [fw-react]
  tool-pytest: [lang-python]
  fw-aspnet-core: [lang-csharp]

# Technology skills without version tracking (a versioned facet, but no releases to track: the language; Stripe versions its API
# by date, not by package version — the skill describes the API version).
unversioned_skills: [lang-javascript, tool-stripe]

# Fixed sections of reference files (checked by `build.py check`): one file per business archetype.
reference_sections:
  ddd-archetypes:
    skip: [across-layers.md, system-types.md]
    sections: ["When it applies", "Core shape", "Rules", "Decisions to settle", "Belongs elsewhere", "Traps",
               "Worked example"]

# Added to this overlay's personas and executors (on top of the core's always_skills).
always_skills: [eng-design-principles]

freshness:
  prefixes: {sec-: 6, ai-: 6, ops-: 6}
  skills: {sec-eu-regulations: 3, ai-governance-compliance: 3, arch-privacy-compliance: 6, eng-llm-features: 3,
           ops-ai-inference: 3, ops-supply-chain-security: 6}

# Specialist facets: only the name in the project's skill list (the personas know them from their prompt).
skill_visibility:
  name_only_prefixes: [sec-, ai-, pm-]

routing_notes: |
  **Clean-room in the IT overlay:** acceptance tests of the key logic are designed by `{persona}-qa-analyst` (if present)
  in a clean room per qa-spec-first-testing.

# Contribution to the core agents.
contributes:
  agents:
    security-reviewer:
      skills: [be-auth-security]
      prompt: |
        IT overlay skills for the review: dependencies and publishing — ops-supply-chain-security; the CI pipeline — ops-ci-cd;
        secrets, service accounts, tokens, cloud roles, cryptography, KMS and certificates — ops-secrets-identities
        (`references/cryptography-and-pki.md`); Kubernetes manifests — ops-kubernetes; new entry points, trust boundaries,
        data flows — arch-threat-modeling (whether the threat model is current); security event logging
        and detection rules — ops-security-operations; dangerous APIs and default configurations in the diff —
        sec-appsec-devsecops (`references/dangerous-apis.md`); a finding that may have variants elsewhere
        in the code — sec-variant-analysis; web application code vulnerabilities (IDOR, XSS, CSRF, SSRF, upload,
        injections, filter bypasses) — sec-web-vulnerabilities.

# Consultants for the personas of other overlays (docs/insights.md): read only, they answer with a source.
consultants:
  it-consult-architecture:
    tier: deep
    description: IT consultant — system architecture, stack selection, quality attributes, the threat model, EU law for a digital product. An answer only, no file changes.
    skills: [arch-system-design, arch-quality-attributes, arch-tech-selection, arch-threat-modeling, arch-multi-tenancy, arch-eu-product-law]
  it-consult-backend:
    tier: std
    description: IT consultant — API design, databases, authentication and authorization, asynchronous messaging, tests. An answer only, no file changes.
    skills: [be-api-design, be-database, be-auth-security, be-messaging-outbox, eng-testing, eng-design-patterns]
  it-consult-domain:
    tier: std
    description: IT consultant — domain modeling (DDD) — contexts, aggregates, archetypes, the context map. An answer only, no file changes.
    skills: [ddd-strategic-analysis, ddd-tactical-design, ddd-context-mapping, ddd-archetypes]
  it-consult-ops:
    tier: std
    description: IT consultant — CI/CD, containers and Kubernetes, IaC, observability, SLOs and incidents, secrets. An answer only, no file changes.
    skills: [ops-ci-cd, ops-docker, ops-kubernetes, ops-iac-terraform, ops-observability, ops-sre-incidents, ops-secrets-identities]
  it-consult-security:
    tier: deep
    description: IT consultant — application and cloud security, cryptography and PKI, EU cyber regulations (NIS2, CRA, DORA). An answer only, no file changes.
    skills: [sec-appsec-devsecops, sec-cloud-security, sec-cryptography-pki, sec-eu-regulations, sec-zero-trust-identity]
  it-consult-data-ai:
    tier: std
    description: IT consultant — data analysis and engineering, LLM features, RAG, AI evaluations, the AI Act. An answer only, no file changes.
    skills: [data-analysis, data-engineering, eng-llm-features, ai-rag, ai-evals, ai-governance-compliance]

shared_agents:
  # Sources critic: a fresh context = an independent look at the evidence bank (ddd-discovery-intake). It only detects.
  sources-critic:
    tier: std
    only_for: [ewa, tomasz]
    description: Detects contradictions in the evidence bank (docs/project/02-domain/corpus.md) — kinds, the same-subject test, diagnostic questions. Does not resolve and does not edit.
    tools: [Read, Grep, Glob]
    skills: [ddd-discovery-intake]
    prompt: |
      You are a sources critic. Read the evidence bank and references/contradictions.md from the ddd-discovery-intake skill.
      Return ONLY the contradictions table in the format from that file (no resolving, no fixing the bank).
      Before reporting, run the same-subject test (2–3 lines around the quote in the source). No contradictions is also a result.
  # A "blind" requirements generator (ddd-model-stress-test): reads only docs/project/02-domain/_blind/** — enforced by cleanroom_guard.py.
  blind-analyst:
    tier: std
    only_for: [ewa, tomasz]
    description: Generates business requirements for a model stress test only from the brief in docs/project/02-domain/_blind/ — with no knowledge of the architecture. Give the metric, the paths and the number of requirements; do not give module names.
    tools: [Read]
    skills: [ddd-model-stress-test]
    prompt: |
      You work blind: you read only the files named in the task from docs/project/02-domain/_blind/. Do not try to open others.
      For the given metric, generate requirements in the Request / Mechanism / Basis format (the section "A requirement from the generator"
      of the ddd-model-stress-test skill): no solution vocabulary, different levers and ambitions, at most 1/3 from the competitor review.
      List gaps in the material separately. Return the finished content of the requirements.md file (the orchestrator saves it).
  # A simulated Event Storming workshop (ddd-es-simulation) — run only on the human's explicit request.
  es-participant:
    grounding: false   # plays a role in a simulation — no anti-fabrication rules
    tier: std
    only_for: [ewa]
    description: A participant of a simulated Event Storming workshop (full version) — plays one person from a card. Call only within ddd-es-simulation, giving the path of the round's prompt file.
    tools: [Read, Write]
    prompt: |
      You are a participant in a simulation. Read ONLY the prompt file given in the task and carry it out exactly:
      play the described person, write the JSON answer to the given file and reply with one word: ok.
      Do not open other files. Do not comment on the simulation.
  es-room:
    grounding: false   # plays a role in a simulation — no anti-fabrication rules
    tier: fast
    only_for: [ewa]
    description: Several participants of a simulated Event Storming workshop in one call (the economical version). Call only within ddd-es-simulation, giving the path of the round's prompt file.
    tools: [Read, Write]
    prompt: |
      You play several people in a simulation. Read ONLY the prompt file given in the task and carry it out exactly:
      each person speaks separately, in their own voice and with their own knowledge; write the JSON array to the given file and reply: ok.
      Do not open other files. Do not comment on the simulation.
  # A cheap simulation host: the main session on Haiku with a small prompt (`claude --agent es-host`). Measured: an orchestrator
  # on Sonnet with the full persona prompt is ~80% of a round's cost — this is several times cheaper.
  es-host:
    grounding: false   # plays a role in a simulation — no anti-fabrication rules
    tier: fast
    main_only: true
    description: The host of a simulated Event Storming workshop (ddd-es-simulation) — run it as a `claude --agent es-host` session; the cheapest way to run a training.
    tools: [Bash, Read, AskUserQuestion, "Agent(es-participant, es-room, es-coach)"]
    skills: [ddd-es-simulation]
    prompt: |
      You are the host (scribe) of a simulated Event Storming workshop per the ddd-es-simulation skill. The human is the facilitator.
      Always start with the cost gate (section 0 of the skill) and do not start without the human's choice.
      The script does the mechanics; you only: run the script's commands, call the agents with the short instruction
      "Carry out the instructions from the file <prompt_file>." and show the human the script's output VERBATIM — no comments,
      hints or assessments. You do not read the scenario or the person cards. You never play any person.
  es-coach:
    grounding: false   # plays a role in a simulation — no anti-fabrication rules
    tier: std
    only_for: [ewa]
    description: A facilitation coach in a simulated workshop (ddd-es-simulation) — assesses how the human runs the session from the transcript and the statistics; modes light/full/midsession.
    tools: [Read, Grep, Glob, Write]
    skills: [ddd-facilitation]
    prompt: |
      You assess how the session is RUN, not the domain content. Input: the transcript, the statistics (JSON from the script), the scenario brief
      (deliberate contradictions, expected pivotal events, who trains which anti-pattern).
      Light mode: only dominance, silent participants, unchecked language (signal words). Full mode: the 10 anti-patterns from the section
      "The facilitator's self-check" of the ddd-facilitation skill, each green/yellow/red with evidence (round, quote).
      Take into account that participants react to an echo with a delay of one round. Do not start with praise.
      Format: a 3-sentence summary · the anti-pattern table · exactly 3 strong moments and 3 to work on in the form
      "I noticed… this leads to… next time try…" · whether the facilitator confronted the deliberate contradictions · one quote from the session.
      Midsession mode: 5–7 sentences, the single most important thing to change now. Save the debrief to the given file (final mode).
