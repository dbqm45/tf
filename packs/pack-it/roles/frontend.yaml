# Role = a discipline, without technology. The language and the framework (lang-*, fw-*) are chosen by the persona in the `stack` field.
skills: [fe-architecture, fe-css, fe-web-platform, fe-technical-seo, eng-i18n, eng-design-patterns, eng-codebase-mapping, eng-legacy-dossier, eng-algorithms-data-structures, eng-debugging, qa-change-review, core-async-delegation, eng-local-quality-gates, eng-refactor-planning, eng-repo-readiness, eng-behavior-preserving-refactoring]
# Skills injected in full at the start — only those the role uses ALWAYS
preload: []
verify: the project's lint, typecheck and tests (the commands from CLAUDE.md)
