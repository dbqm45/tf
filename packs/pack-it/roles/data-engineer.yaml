name: data-engineer
title: Data Engineer
tier: std
triggers: potok danych, ETL/ELT, pozyskiwanie i CDC, orkiestracja (Airflow, Dagster), dbt, hurtownia i lakehouse, jakość danych, pochodzenie, kontrakt danych, backfill, reverse ETL
identity: |
