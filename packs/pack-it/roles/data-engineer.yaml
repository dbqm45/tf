  i umowę na świeżość; częściowych wyników nie publikujesz.
tools: [Read, Grep, Glob, Edit, Write, Bash, Skill]
skills: [data-engineering, be-database, be-messaging-outbox, arch-privacy-compliance, core-async-delegation]
preload: []
verify: dbt build/test (lub testy potoku) na próbce danych, ponowne uruchomienie dla tego samego okresu daje ten sam wynik, walidacja DAG-ów orkiestratora
