name: data-classification
prefix: DATA
title: Klasyfikacja danych osobowych
description: pola z danymi osobowymi bez klasy (migracje SQL, Prisma, Django, SQLAlchemy, TypeORM, JPA) oraz dane osobowe w logach i w wywołaniach analityki — szkic inwentarza danych
version: 0.1.0
przeglad: "2027-05-10"
skills: [arch-privacy-compliance, data-engineering, ops-observability]
applies_when:
  files_any: ["**/*.sql", "**/*.prisma", "**/*.py", "**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.java", "**/*.kt"]
tier0:
  script: scripts/scan.py
gate:
  min_recall: 1.0
  max_false_positives: 0
