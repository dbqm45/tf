name: observability
prefix: OBS
title: Service observability
description: an HTTP service without a health check and without a correlation id, console.log/print instead of a logger, swallowed errors (empty catch, except pass) — Express, Fastify, Koa, NestJS, Hono, FastAPI, Flask, Django, Spring
version: 0.1.0
review: "2027-05-10"
skills: [ops-observability, ops-sre-incidents, ops-kubernetes]
incremental: false   # repository-level rules (health route, correlation id) need all the files
applies_when:
  files_any: ["**/*.py", "**/*.ts", "**/*.tsx", "**/*.js", "**/*.mjs", "**/*.java", "**/*.kt"]
tier0:
  script: scripts/scan.py
gate:
  min_recall: 1.0
  max_false_positives: 0
