name: i18n
prefix: I18N
title: Internationalisation
description: UI text outside the translation function in a project with a translation library, dates and numbers formatted without a locale, amounts from toFixed glued to a currency instead of Intl.NumberFormat
version: 0.1.0
review: "2027-05-10"
skills: [eng-i18n, fe-web-platform, ux-content-design]
incremental: false   # whether the text rule applies depends on the package.json of the whole project
applies_when:
  files_any: ["**/*.tsx", "**/*.jsx", "**/*.vue", "**/*.svelte", "**/*.html", "**/*.ts", "**/*.js"]
tier0:
  script: scripts/scan.py
gate:
  min_recall: 1.0
  max_false_positives: 0
