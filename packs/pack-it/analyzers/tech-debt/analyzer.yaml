name: tech-debt
prefix: DEBT
title: Technical debt (markers, skipped tests, suppressions)
description: TODO/FIXME/HACK without a ticket (with the age from git), skipped tests without a reason, suppressed checks (ts-ignore, eslint-disable, noqa, type ignore), code files over 1000 lines
version: 0.1.0
review: "2027-05-10"
skills: [eng-tech-debt-audit, eng-clean-code, qa-regression]
applies_when:
  files_any: ["**/*.py", "**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.java", "**/*.kt", "**/*.go", "**/*.cs", "**/*.rb", "**/*.php", "**/*.rs"]
tier0:
  script: scripts/scan.py
gate:
  min_recall: 1.0
  max_false_positives: 0
