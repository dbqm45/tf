# Change definition check and security scan on every PR (mode-pdi; ci_for_sdlc, Z8c-2).
# Install: python3 .claude/skills/pdi-decisions/scripts/phase_run.py workflow install --workflow change-check
# The same scan as in the factory's piece loop (`security_scan.py scan`, skill tf): semgrep with the OWASP Top 10 rules
# (and the product's `.semgrep.yml`) on the files changed since the PR base, a dependency audit (npm audit / pip-audit) only when
# a manifest or lockfile changes; the SARIF in reports/security goes to ci_for_sdlc (`--sarif`): SEC-001 (an error or a
# warning with a CWE from the OWASP Top 10) blocks, SEC-002 and SEC-003 inform; annotations on the file and line.
# No scanner, or a scan that wrote no SARIF, is a red gate (missing file), never a silent PASS.
# Network: the `p/owasp-top-ten` rules are fetched from semgrep.dev on every run (in the persona's sandbox the host is on
# the allowlist, pdi Z8a); without network set the repository variable TF_SEMGREP_CONFIG to a rules file in the repo.
# Note: for security pin the actions to a full commit SHA, and ci_for_sdlc to a release tag (vX.Y.Z).
name: Definition check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: change-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: the pieces' files from the `Change:` trailers in commits, and the scan and --base need the base branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scanners
        run: |
          pipx install semgrep==1.183.0
          pipx install pip-audit==2.10.1
      # One product verification command (N3, the first line of CLAUDE.md) — the same as in the factory loop. Mandatory: the PR loop
      # (pdi N2) counts a PR as green only with CI checks, and this step runs the product's tests on every code PR.
      # No verify.sh is a red step with an instruction to add it, never a silent PASS. Set the stack's tools (node, uv…) above.
      - name: Product verification (N3)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ ! -f verify.sh ]; then
            echo "::error::No ./verify.sh (N3) — copy .claude/skills/tf/templates/verify.sh, write the stack's commands and name it in the first line of CLAUDE.md"
            exit 1
          fi
          BASE="origin/$BASE_REF" SCAN_OUT=reports/security-verify bash verify.sh
      # The scan before the ci_for_sdlc checkout: the untracked .ci_for_sdlc directory must not get into the change's files.
      - name: Security scan
        # ci_for_sdlc judges the blocking findings (SEC-001…003), scan errors one step below
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
          TF_SEMGREP_CONFIG: ${{ vars.TF_SEMGREP_CONFIG }}
        run: |
          python3 .claude/skills/tf/scripts/security_scan.py scan --base "origin/$BASE_REF" --out reports/security
      # ci_for_sdlc judges the findings below; a scan error (no scanner, an audit that did not run) turns red at once,
      # also when part of the SARIF was written — otherwise a missing audit would look clean.
      - name: Scan errors
        run: |
          python3 -c 'import json, sys; e = json.load(open("reports/security/verdict.json")).get("errors"); [print(f"::error::{x}") for x in e]; sys.exit(1 if e else 0)'
      - uses: actions/checkout@v7
        with:
          repository: dbqm45/ci_for_sdlc
          ref: main
          path: .ci_for_sdlc
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --workspace @ci/core --workspace @ci/server
        working-directory: .ci_for_sdlc
      - name: Change and scan check
        working-directory: .ci_for_sdlc
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          CI_DATA_DIR: ${{ runner.temp }}/ci-data
          # The tests' JUnit report (a file or a directory, relative to the repo); empty — no test results.
          TEST_REPORTS: ''
          SARIF_REPORTS: reports/security
          # Z7b-1b: coverage and mutations of the changed code (TGT-001, TGT-002). The product runs the tools itself
          # (e.g. `pytest --cov=src --cov-report=lcov:reports/coverage/lcov.info`,
          # `npx stryker run --reporters json` → `reports/mutation/stryker.json`); the template only passes
          # the report to `npm run analyze`. An empty input = no report; if release.yaml has `targets.coverage`
          # or `targets.mutation`, a missing report is a blocking gate (TGT-001/002 critical).
          COVERAGE_REPORTS: ''
          MUTATION_REPORTS: ''
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -- --repo "$GITHUB_WORKSPACE" --repo-url "$REPO_URL" --fail-on critical
          if [ -n "$TEST_REPORTS" ]; then set -- "$@" --tests "$GITHUB_WORKSPACE/$TEST_REPORTS"; fi
          for p in $SARIF_REPORTS; do set -- "$@" --sarif "$GITHUB_WORKSPACE/$p"; done
          for p in $COVERAGE_REPORTS; do set -- "$@" --coverage "$GITHUB_WORKSPACE/$p"; done
          for p in $MUTATION_REPORTS; do set -- "$@" --mutation "$GITHUB_WORKSPACE/$p"; done
          set -- "$@" --base "origin/$BASE_REF"
          npm run analyze -- "$@"
