# Control bands on ShipScope PROD metrics (mode-pdi, F5): once a day the series from the ShipScope service API,
# levels from control_band.py, and a point outside 3σ in the last days → a signed metric.breached to the pdi inbox.
# Install: python3 .claude/skills/pdi-decisions/scripts/metric_watch.py workflow install
# Repository secrets: SHIPSCOPE_TOKEN (a service token shps_… from ShipScope: Settings → General → Service tokens),
# PDI_TF_SIGNING_SECRET (the same as PDI_TF_SIGNING_SECRET of the pdi receiver). Repository variables: SHIPSCOPE_URL,
# PDI_EVENTS_URL (https). No model is called; metrics and thresholds: .claude/pdi-metrics.json.
# Note: for security pin the actions to a full commit SHA (e.g. skill ops-ci-cd in pack-it).
name: metric-watch

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metric-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Control bands and metric.breached to pdi
        env:
          SHIPSCOPE_URL: ${{ vars.SHIPSCOPE_URL }}
          SHIPSCOPE_TOKEN: ${{ secrets.SHIPSCOPE_TOKEN }}
          PDI_EVENTS_URL: ${{ vars.PDI_EVENTS_URL }}
          PDI_TF_SIGNING_SECRET: ${{ secrets.PDI_TF_SIGNING_SECRET }}
        run: python3 .claude/skills/pdi-decisions/scripts/metric_watch.py check --send
