# Release plan of change {CHG} — pdi contract 0.12.0 (release-plan.schema.json); checked by: decision_record.py check.
# R1 = MVP: the north star plus the minimum for the outcome from intent.md. Every TSK from plan.md in exactly one line;
# the "Release" and "Flag" columns in plan.md must agree with this file.
change: {CHG}
mvp:
  release: R1
  # outcome: <the outcome for the user from intent.md>
  # metric: { name: <metric>, target: "<threshold, e.g. >= 25%>", horizon_days: 30 }
  # guardrails: [<a guardrail metric, e.g. double_charges = 0>]
releases:
  - { id: R1, name: MVP, tasks: [] }
  # - { id: R2, tasks: [] }        # what was deferred from the MVP ("Out of the MVP scope")
# flags:                           # a cut deployed before the decision to make it available
#   - key: <klucz-flagi>
#     tasks: [TSK-n]
#     owner: <who decides on moving to the next stage>
#     remove_by: YYYY-MM-DD
#     rollout:
#       - { stage: internal, min_days: 3, exit: "<exit criterion>" }
#       - { stage: "10%", min_days: 7, exit: "<exit criterion>" }
#       - { stage: "100%" }
# Change targets (Z7b-1, DZ7). The architect proposes the same values in plan.md; the human approves them at B3.
# `coverage` and `mutation` only for the changed code (N4). For an AI product `evaluations` are mandatory (DZ7).
# targets:
#   coverage: { kind: changed_lines, min_percent: 90, tool: pytest-cov }
#   mutation: { kind: changed_lines, tool: mutmut, min_score: 70 }
#   # performance:
#   #   - { name: p95_login, metric: response_time_p95_ms, limit: "<= 400", note: "follows from an SLO of 99.5% in 28 days" }
#   # evaluations:          # required for an AI product (DZ7)
#   #   - { name: rag_answer_quality, dataset: eval/rag.jsonl, metric: faithfulness, min: 0.9 }
