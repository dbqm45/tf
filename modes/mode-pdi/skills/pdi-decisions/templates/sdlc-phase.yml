# A change phase run by pdi (mode-pdi, F4): a decision at a gate → the persona's work without interaction → the phase PR →
# a request for the next gate in the pdi inbox. pdi calls this workflow through workflow_dispatch (PDI_DISPATCH_REPO,
# PDI_DISPATCH_WORKFLOW=sdlc-phase.yml) with the inputs below.
# Install: python3 .claude/skills/pdi-decisions/scripts/phase_run.py workflow install
# Repository secrets: ANTHROPIC_API_KEY (Claude Code), PDI_TF_SIGNING_SECRET (the same as PDI_TF_SIGNING_SECRET
# of the pdi receiver). Repository variable: PDI_EVENTS_URL (the pdi receiver's address, https).
# Inputs from pdi reach the commands only through env (never directly in `run:`), so that no command can be injected.
# Note: for security pin the actions to a full commit SHA (e.g. skill ops-ci-cd in pack-it).
# Persona isolation (pdi Z8a): a checkout without a stored token, GH_TOKEN only in the steps with push and PR, and the persona works in
# the Claude Code sandbox (managed settings from sandbox_settings.py: no egress beyond the host list, no reading
# of secrets, tokens invisible to commands). Extra hosts: the repository variable PDI_DISPATCH_ALLOW_HOSTS.
name: sdlc-phase
run-name: "pdi: ${{ inputs.change }} ${{ inputs.phase }}"

on:
  workflow_dispatch:
    inputs:
      change:
        description: "Change (CHG-n)"
        required: true
      phase:
        description: "Phase: intent, requirements, architecture, design, delivery"
        required: true
      gate:
        description: "The gate at which the decision was made (B1…)"
        required: false
      outcome:
        description: "Gate outcome: approved, changes_requested, rejected"
        required: false
      decision:
        description: "Decision number in the pdi register (DEC-n)"
        required: false
      rework:
        description: "true — fixes of the same phase after changes_requested"
        required: false
        default: "false"
      budget_usd:
        description: "Hard phase cost limit in USD (empty — no limit)"
        required: false
      source:
        description: "The report (PRB-n) the change came from — on acceptance in pdi (intent phase)"
        required: false
      problem:
        description: "The report content from pdi (JSON) for the intent phase persona"
        required: false
      decision_text:
        description: "The outcome and justification of the gate decision (from the pdi register) for the decisions.md entry"
        required: false
      answers:
        description: "Answers to the gate questions from pdi (JSON [{question, answer}], pdi contract 0.12.0)"
        required: false
      decisions:
        description: "Other decisions of the change from the pdi register (JSON, links.chg) for decisions.md (decision import)"
        required: false
      artifact_sha256:
        description: "SHA-256 of the artifact version approved at the gate (contract 0.21.0); the next phase checks it"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sdlc-phase-${{ github.event.inputs.change }}
  cancel-in-progress: false

jobs:
  phase:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CHANGE: ${{ inputs.change }}
      PHASE: ${{ inputs.phase }}
      GATE: ${{ inputs.gate }}
      OUTCOME: ${{ inputs.outcome }}
      DECISION: ${{ inputs.decision }}
      REWORK: ${{ inputs.rework }}
      BUDGET_USD: ${{ inputs.budget_usd }}
      SOURCE: ${{ inputs.source }}
      PDI_PROBLEM: ${{ inputs.problem }}
      DECISION_TEXT: ${{ inputs.decision_text }}
      ANSWERS: ${{ inputs.answers }}
      APPROVED_ARTIFACT: ${{ inputs.artifact_sha256 }}
      DECISIONS: ${{ inputs.decisions }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # no token in .git/config: the persona will not read it; push and PR have GH_TOKEN only in their steps
          persist-credentials: false
      - name: Phase branch (fixes go to the same PR)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          branch="pdi/$CHANGE-$PHASE"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git checkout -B "$branch" "origin/$branch"
            # fixes after a gate: first the current default branch, so the project log and decisions.md do not diverge
            git merge --no-edit "origin/$DEFAULT_BRANCH"
          else
            git checkout -b "$branch"
          fi
      - name: Change log from the report (acceptance in pdi, F3)
        if: env.PHASE == 'intent' && env.SOURCE != ''
        run: |
          if [ ! -d "docs/project/changes/$CHANGE" ]; then
            # The report day (reported_at from pdi) into the header: ShipScope counts the lead time from the report from it.
            reported=$(python3 -c 'import json, os; p = json.loads(os.environ.get("PDI_PROBLEM") or "{}"); print(p.get("reported_at", "") if isinstance(p, dict) else "")')
            args=(--source "$SOURCE" --author pdi)
            if [ -n "$reported" ]; then args+=(--source-reported-at "$reported"); fi
            python3 .claude/skills/pdi-decisions/scripts/decision_record.py change new "$CHANGE" "${args[@]}"
          fi
      - name: Input check (no model)
        run: python3 .claude/skills/pdi-decisions/scripts/phase_run.py prompt --change "$CHANGE" --phase "$PHASE" > /dev/null
      - name: Change decisions from the pdi register into decisions.md (Z1)
        if: env.DECISIONS != ''
        run: |
          printf '%s' "$DECISIONS" > "$RUNNER_TEMP/decisions.json"
          python3 .claude/skills/pdi-decisions/scripts/decision_record.py decision import "$CHANGE" --json "$RUNNER_TEMP/decisions.json"
      - name: Gate decision into decisions.md
        if: env.DECISION != ''
        run: |
          args=(--gate "$GATE" --outcome "$OUTCOME" --id "$DECISION")
          if [ -n "$DECISION_TEXT" ]; then args+=(--why "$DECISION_TEXT"); fi
          if [ -n "$APPROVED_ARTIFACT" ]; then args+=(--artifact-sha256 "$APPROVED_ARTIFACT"); fi
          if [ -n "$ANSWERS" ]; then
            printf '%s' "$ANSWERS" > "$RUNNER_TEMP/answers.json"
            args+=(--answers "$RUNNER_TEMP/answers.json")
          fi
          python3 .claude/skills/pdi-decisions/scripts/decision_record.py decision gate "$CHANGE" "${args[@]}"
      - name: Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.310
      - name: Claude Code sandbox for the persona
        env:
          PDI_DISPATCH_ALLOW_HOSTS: ${{ vars.PDI_DISPATCH_ALLOW_HOSTS }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap socat
          # Ubuntu 24.04: AppArmor blocks user namespaces for bwrap (Claude Code sandbox documentation)
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\n\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' \
              | sudo tee /etc/apparmor.d/bwrap > /dev/null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          python3 .claude/skills/pdi-decisions/scripts/sandbox_settings.py > "$RUNNER_TEMP/claude-settings.json"
          sudo install -D -m 644 "$RUNNER_TEMP/claude-settings.json" /etc/claude-code/managed-settings.json
          echo "PDI_CLAUDE_SETTINGS=/etc/claude-code/managed-settings.json" >> "$GITHUB_ENV"
      # The factory loop in the delivery phase scans every piece (security_scan.py, Z8c-2); without a scanner the piece stops (FAIL).
      - name: Security scanners (delivery)
        if: env.PHASE == 'delivery'
        run: |
          pipx install semgrep==1.183.0
          pipx install pip-audit==2.10.1
      - name: Cut branches before the delivery phase
        if: env.PHASE == 'delivery'
        run: python3 .claude/skills/pdi-decisions/scripts/phase_run.py cuts list > "$RUNNER_TEMP/cuts-before.json"
      - name: Non-interactive phase
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=(--change "$CHANGE" --phase "$PHASE")
          if [ "$REWORK" = "true" ]; then args+=(--rework --gate "$GATE" --decision "$DECISION"); fi
          if [ -n "$BUDGET_USD" ]; then args+=(--budget-usd "$BUDGET_USD"); fi
          PDI_SOURCE="$SOURCE" python3 .claude/skills/pdi-decisions/scripts/phase_run.py run "${args[@]}"
      # Second review (N1, DZ12): an independent model reads the artifact together with the change's decisions and lists gaps for the gate.
      # The provider key is visible ONLY to this step (not to the phase persona) — Z8g: it does not enter the phase container.
      # OPENAI_API_KEY optional; without it the script falls back to a Claude model and marks the result as same-vendor.
      - name: Second review (requirements/architecture)
        if: env.PHASE == 'requirements' || env.PHASE == 'architecture'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PDI_SECOND_MODEL: ${{ vars.PDI_SECOND_MODEL }}
          PDI_SECOND_MODEL_PRICE_IN: ${{ vars.PDI_SECOND_MODEL_PRICE_IN }}
          PDI_SECOND_MODEL_PRICE_OUT: ${{ vars.PDI_SECOND_MODEL_PRICE_OUT }}
        run: |
          python3 .claude/skills/pdi-decisions/scripts/second_review.py artifact \
            --change "$CHANGE" --phase "$PHASE"
      # The persona in --print cannot push or open PRs (git push asks for consent) — the workflow does it.
      # Note: a push with the github.token token does not run CI workflows on these branches (a GitHub limitation).
      # That is why the PR loop (N2: review → comment validation → fix → green CI) works only in pdi's local mode
      # (PDI_DISPATCH=local, push with the owner's gh token); here the cut PRs go without the loop (pdi docs/plan-n2-petla-pr.md).
      - name: Cut PRs (delivery)
        if: env.PHASE == 'delivery'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python3 .claude/skills/pdi-decisions/scripts/phase_run.py cuts publish --before "$RUNNER_TEMP/cuts-before.json" --base "$DEFAULT_BRANCH"
      - name: Phase PR
        id: pr
        if: env.PHASE != 'delivery'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs($CHANGE): phase $PHASE (pdi)" -m "Change: $CHANGE"
          fi
          git push -u origin "$BRANCH"
          url=$(gh pr view "$BRANCH" --json url -q .url 2>/dev/null || gh pr create --fill --head "$BRANCH")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Gate request to pdi
        if: env.PHASE != 'delivery'
        env:
          PDI_TF_SIGNING_SECRET: ${{ secrets.PDI_TF_SIGNING_SECRET }}
          PDI_EVENTS_URL: ${{ vars.PDI_EVENTS_URL }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: python3 .claude/skills/pdi-decisions/scripts/phase_run.py gate request --change "$CHANGE" --phase "$PHASE" --url "$PR_URL"
