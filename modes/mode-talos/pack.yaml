# Warstwa zgodności (przestarzałe): pętla „zadanie → PR” jest od 9.34 w rdzeniu (skill tf, agent tf, polecenie /tf).
# Ten tryb zostawia stare nazwy — /talos-story-run, agent talos, ścieżka skryptów — żeby istniejące instalacje
# działały bez zmian. Nowe instalacje go nie dostają; do usunięcia w następnym wydaniu MAJOR. Przewodnik: GUIDE.md.
id: mode-talos
kind: mode
version: 1.4.0
title: Talos (compatibility)
description: Deprecated compatibility layer — the task loop moved into the core (/tf, `claude --agent tf`). Keeps /talos-story-run, the agent `talos` and the old script paths working for existing installs.
content_language: pl
default: false         # nowe instalacje go nie dostają; istniejące zachowują go przy aktualizacji
requires:
  core: ">=9.33.0 <10.0.0"   # pętla (skill tf, agent tf) jest w rdzeniu; warstwa tylko do niej przekierowuje

facets:
  - {prefix: talos-, order: 190, name: zgodność (Talos), question: "stara nazwa pętli zadanie → PR (przestarzałe; użyj /tf)"}

# Alias skilla uruchamia tylko człowiek (/talos-story-run) albo alias agenta — nie należy do żadnej roli.
standalone_skills: [talos-story-run]

shared_agents:
  # Alias agenta `tf` z rdzenia pod starą nazwą.
  talos:
    tier: std
    main_only: true
    description: Przestarzała nazwa agenta `tf` (pętla fabryki „zadanie → PR”). Uruchom `claude --agent tf`; ta nazwa zostaje dla istniejących instalacji.
    tools: ["Agent(scout, researcher, quick-fixer, scope-reviewer, architect, security-reviewer)", Read, Grep, Glob, Edit, Write, Bash]
    prompt: |
      Prowadzisz pętlę fabryki: zamieniasz jedno zadanie w jeden PR. Pracujesz wyłącznie w tym trybie.
      Zanim zrobisz cokolwiek innego, przeczytaj narzędziem Read `.claude/skills/tf/SKILL.md` i prowadź
      przebieg dokładnie według niego: start (`run_report.py start`), przyjęcie historyjki, plan z kawałków, pętla
      kawałka, zakończenie z PR i `run_report.py finish`.
      Opcje bierzesz z wiadomości człowieka: `--auto` — plan nie czeka na akceptację; `--budget <USD>` — twardy STOP
      po kawałku, który przekroczy budżet. Bez zadania w wiadomości poproś o nie jednym zdaniem.
      Najtaniej i najprościej: kryteria akceptacji, nic ponad nie; przypadki brzegowe do `parked.md`; najtańszy
      wystarczający wykonawca; najwyżej 2 próby naprawy na bramkę, potem blok STOP. Nie scalasz PR.
      Ta nazwa agenta jest przestarzała: w podsumowaniu powiedz człowiekowi, że następnym razem `claude --agent tf`.
