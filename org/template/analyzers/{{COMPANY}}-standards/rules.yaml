# Reguły {{TITLE}} sprawdzane bez modelu. Regułę, którą da się zapisać wzorcem, wpisz tutaj, a nie do skilla:
# skrypt wskaże naruszenie z plikiem i linią, a agent nie musi czytać reguły w każdej sesji.
# Pola: id, title, files, exclude, forbid (wzorzec zakazany w linii) albo require (wzorzec wymagany w pliku,
# z head: N — w pierwszych N liniach), severity (krytyczna | wysoka | średnia | niska), suggestion, basis.
# Po każdej zmianie dopisz przykład naruszenia do fixtures/violations i jego oczekiwane ustalenie do expected.json.
# Reguły grupuj według obszarów (UI, API, dane, wydania) i zawężaj polem `files` do katalogów obszaru: przy zmianie
# w wyglądzie skaner nie zgłasza reguł API.
rules:
  # ── wspólne ──
  # TODO: przykład — zamień na regułę firmy albo usuń (razem z przykładem w fixtures/).
  - id: przyklad-print
    title: print zamiast loggera
    files: ["**/*.py"]
    exclude: ["tests/**", "scripts/**"]
    forbid: '^\s*print\('
    severity: niska
    suggestion: "TODO: nazwa firmowego loggera"
    basis: "TODO: dokument firmowy i data"

  # Więcej przykładów (odkomentuj i dopasuj):
